name: CI

# Repository policy: every `uses:` must be pinned to a full-length commit SHA, so the
# actions below are pinned to the v4 tags' commits instead of `@v4`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Plugins are discovered, not hardcoded: any top-level directory whose package.json
  # carries a `dlient` manifest is a plugin. Adding a plugin therefore needs no CI
  # change — and, more importantly, a new plugin cannot slip through unchecked.
  discover:
    name: discover plugins
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: List plugin directories
        id: list
        run: |
          node -e '
            const fs = require("node:fs")
            const dirs = fs
              .readdirSync(".")
              .filter((name) => {
                try {
                  return Boolean(JSON.parse(fs.readFileSync(`${name}/package.json`, "utf8")).dlient)
                } catch {
                  return false
                }
              })
              .sort()
            console.log(`discovered plugins: ${dirs.join(", ") || "(none)"}`)
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `plugins=${JSON.stringify(dirs)}\n`)
          '

  # Each plugin is a self-contained npm project (own manifest + lockfile), so the
  # checks run per plugin directory instead of from the repository root.
  check:
    name: check (${{ matrix.plugin }})
    needs: discover
    if: needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Stable check name for the branch ruleset: matrix job names change whenever a
  # plugin is added or removed, and a skipped matrix leg would never report a status.
  ci-ok:
    name: ci-ok
    needs: [discover, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all plugin checks passed
        if: needs.discover.result != 'success' || needs.check.result == 'failure' || needs.check.result == 'cancelled'
        run: |
          echo "discover: ${{ needs.discover.result }} / check: ${{ needs.check.result }}"
          exit 1
