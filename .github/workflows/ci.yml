name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each plugin is a self-contained npm project (own manifest + lockfile), so the
  # checks run per plugin directory instead of from the repository root.
  check:
    name: check (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [dev-tools, dsh, todo-list]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.plugin }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Stable check name for the branch ruleset: matrix job names change whenever a
  # plugin is added, and a skipped matrix leg would never report a status.
  ci-ok:
    name: ci-ok
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all plugin checks passed
        if: needs.check.result != 'success'
        run: |
          echo "check job result: ${{ needs.check.result }}"
          exit 1
